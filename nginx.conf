map $host $python_port {
    default 3434;
    api2.${EMAGE_HOST} 3435;
    api3.${EMAGE_HOST} 3436;
    api4.${EMAGE_HOST} 3437;
}
server {
    listen 80 default_server;
    include /etc/nginx/emage-tls/*.conf;
    server_name ${EMAGE_HOST};
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=30s;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location /admin {
        set $admin_backend http://admin:8080;
        proxy_pass $admin_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /js/admin.js {
        set $admin_backend http://admin:8080;
        proxy_pass $admin_backend;
        proxy_set_header Host $http_host;
    }
    location / { try_files $uri $uri/ =404; }
}
server {
    listen 80;
    include /etc/nginx/emage-tls/*.conf;
    server_name api.${EMAGE_HOST};
    resolver 127.0.0.11 valid=30s;
    client_max_body_size 0;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / {
        set $api_backend http://server:3233;
        proxy_pass $api_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
server {
    listen 80;
    include /etc/nginx/emage-tls/*.conf;
    server_name *.${EMAGE_HOST};
    resolver 127.0.0.11 valid=30s;
    client_max_body_size 0;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / {
        set $python_backend http://demo:$python_port;
        proxy_pass $python_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
