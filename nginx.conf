map $http_x_forwarded_proto $public_scheme {
    default $scheme;
    http http;
    https https;
}
map $host $python_port {
    default 3434;
    api2-${EMAGE_HOST} 3435;
    api3-${EMAGE_HOST} 3436;
    api4-${EMAGE_HOST} 3437;
}
server {
    listen 7515 default_server;
    server_name _;
    return 444;
}
server {
    listen 7515;
    server_name ${EMAGE_HOST};
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=30s;
    location /admin {
        set $admin_backend http://admin:8080;
        proxy_pass $admin_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $public_scheme;
    }
    location = /js/admin.js {
        set $admin_backend http://admin:8080;
        proxy_pass $admin_backend;
        proxy_set_header Host $http_host;
    }
    location / { try_files $uri $uri/ =404; }
}
server {
    listen 7515;
    server_name api-${EMAGE_HOST};
    resolver 127.0.0.11 valid=30s;
    client_max_body_size 0;
    location / {
        set $api_backend http://server:3233;
        proxy_pass $api_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $public_scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
server {
    listen 7515;
    server_name api1-${EMAGE_HOST} api2-${EMAGE_HOST} api3-${EMAGE_HOST} api4-${EMAGE_HOST} ~^[a-zA-Z0-9-]+-\Q${EMAGE_HOST}\E$;
    resolver 127.0.0.11 valid=30s;
    client_max_body_size 0;
    location / {
        set $python_backend http://demo:$python_port;
        proxy_pass $python_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $public_scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
