server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/client-auth.conf;
    error_page 401 = /login;

    location = /_client_auth {
        internal;
        auth_request off;
        proxy_pass http://127.0.0.1:8083/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location = /login {
        auth_request off;
        proxy_pass http://127.0.0.1:8083/login;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /admin {
        try_files /admin.html =404;
    }

    location /admin/api/ {
        resolver 127.0.0.11 valid=10s;
        set $admin_backend http://admin:8080;
        proxy_pass $admin_backend;
        proxy_http_version 1.1;
        proxy_read_timeout 15s;
    }

    location /demo/ {
        resolver 127.0.0.11 valid=10s;
        set $demo_backend http://demo:8082;
        proxy_pass $demo_backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# Container-only health probes check the same files without a browser login.
server {
    listen 127.0.0.1:8081;
    root /usr/share/nginx/html;
    location / { try_files $uri =404; }
}
