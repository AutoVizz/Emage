server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/client-auth.conf;

    location = /admin {
        try_files /admin.html =404;
    }

    location /admin/api/ {
        resolver 127.0.0.11 valid=10s;
        set $admin_backend http://admin:8080;
        proxy_pass $admin_backend;
        proxy_http_version 1.1;
        proxy_read_timeout 15s;
    }

    location /demo/ {
        resolver 127.0.0.11 valid=10s;
        set $demo_backend http://demo:8082;
        proxy_pass $demo_backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# Container-only health probes check the same files without a browser login.
server {
    listen 127.0.0.1:8081;
    root /usr/share/nginx/html;
    location / { try_files $uri =404; }
}
