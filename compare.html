<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emage Compare</title>
<script src="js/theme.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/emage-transparent.ico" type="image/x-icon">
</head>
<body>
<div class="page"><div class="shell">
<aside id="side" data-active="compare"></aside>
<main class="main">
<header class="head"><div class="workspace-heading"><h1>Compare strategies</h1><label class="theme-control">Theme<select data-theme-select aria-label="Color theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label></div>
<p class="lede">Load the same image three ways and see what each one costs in bytes, requests and waiting time.</p></header>

<section class="card" aria-label="Run setup" style="gap:20px">
<div class="card bar" style="padding:0">
<div class="stack"><label class="lbl" for="serverUrl">Server URL</label><input id="serverUrl" class="field mono" value="http://localhost:3233"></div>
<div class="stack"><label class="lbl" for="imgPath">Image path</label><input id="imgPath" class="field mono" value="" placeholder="folder/image.j2k"></div>
<div class="stack"><label class="lbl" for="sizeInput">Display size <span>· progressive target</span></label><input id="sizeInput" class="field mono" value="200" placeholder="200, 10vw"></div>
</div>
<div class="stack"><label class="lbl" for="keyInput">Decryption key <span>· AES-256, hex</span></label><input id="keyInput" class="field mono" style="font-size:12px" value="" placeholder="64 hex digits; blank for plaintext"></div>
<div class="between"><div id="imgMeta" class="wrap" style="gap:8px"><span class="pill">Run a comparison to inspect this image</span></div>
<button id="runBtn" class="btn primary" type="button">Run comparison</button></div>
</section>

<section class="stack" style="gap:16px"><div class="title"><span class="step">1</span><h2>Render</h2></div><div id="panels" class="panels"></div></section>

<section class="card">
<div class="between"><div class="title"><span class="step">2</span><h2>Results</h2></div><span class="sub">Shorter bars are better. The best value in each row is marked.</span></div>
<div class="scroll"><div id="tbl" class="tbl" role="table" aria-label="Strategy comparison"></div></div>
</section>

<div id="status" class="status" role="status"><i></i><span class="mono">Loading WebAssembly codecs…</span></div>
</main>
</div></div>
<script type="module" src="js/compare.js"></script>
</body>
</html>
