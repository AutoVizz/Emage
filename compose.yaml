services:
  client:
    ports:
      - "${CLIENT_PORT:-3433}:80"
    build:
      context: .
      additional_contexts:
        wasm-source: ${WASM_SOURCE:-../EmageWasm}
      args:
        EMAGE_API_URL: ${EMAGE_API_URL:-}
        EMAGE_DEMO_URL: ${EMAGE_DEMO_URL:-}
    environment:
      EMAGE_HOST: ${EMAGE_HOST:-emage.localhost}
    restart: unless-stopped
