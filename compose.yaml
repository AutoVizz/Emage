services:
  client:
    ports:
      - "${CLIENT_PORT:-3433}:80"
    build:
      context: .
      additional_contexts:
        wasm-source: ${WASM_SOURCE:-../EmageWasm}
      args:
        EMAGE_API_URL: ${EMAGE_API_URL:-http://localhost:3233}
        EMAGE_DEMO_URL: ${EMAGE_DEMO_URL:-http://localhost:8082}
    restart: unless-stopped
